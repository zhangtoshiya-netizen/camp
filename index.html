<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一月一露 · 四人露营</title>
<meta name="description" content="9月25日松江露营装备分工">
<style id="css">
:root{
  --ground:#EDF1EA; --card:#FFFFFF; --ink:#18241E; --muted:#5B6B61; --line:#D5DDD3;
  --forest:#1F4A38; --forest-soft:#DCE8DF; --ember:#C85A36; --ember-soft:#F6E1D6;
  --hero-bg:#1F4A38; --hero-fg:#F3F6EF; --hero-muted:#B9CDBF; --ok:#2E7D4F; --warn:#A5561C;
  --radius:14px;
  --sans:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Noto Serif SC","Songti SC",STSong,serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#101814; --card:#18231D; --ink:#E4ECE5; --muted:#98AA9E; --line:#2A3A31;
    --forest:#86C9A3; --forest-soft:#1F3328; --ember:#EE875F; --ember-soft:#3A2419;
    --hero-bg:#17302A; --hero-fg:#EEF4EE; --hero-muted:#9DB8A8; --ok:#6FCB94; --warn:#F0A56C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#101814; --card:#18231D; --ink:#E4ECE5; --muted:#98AA9E; --line:#2A3A31;
  --forest:#86C9A3; --forest-soft:#1F3328; --ember:#EE875F; --ember-soft:#3A2419;
  --hero-bg:#17302A; --hero-fg:#EEF4EE; --hero-muted:#9DB8A8; --ok:#6FCB94; --warn:#F0A56C;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.6 var(--sans);-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,p{margin:0}
a{color:var(--forest);font-weight:500}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

.hero{background:var(--hero-bg);color:var(--hero-fg);border-radius:20px;padding:22px 20px 0;display:grid;grid-template-columns:1fr auto;gap:8px 16px;overflow:hidden}
.hero h1{font-family:var(--serif);font-size:clamp(24px,6vw,32px);line-height:1.2;text-wrap:balance;letter-spacing:.02em}
.hero .sub{color:var(--hero-muted);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-bottom:20px}
.chip{background:rgb(255 255 255 / 10%);border:1px solid rgb(255 255 255 / 16%);border-radius:999px;padding:3px 10px;font-size:13px;white-space:nowrap}
.hero svg{width:150px;align-self:end;display:block}
@media (max-width:520px){.hero{grid-template-columns:1fr}.hero svg{width:130px;justify-self:end;margin-top:-8px}}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.panel h2{font-size:16px;font-weight:700;margin-bottom:10px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.map svg{width:100%;height:auto;display:block;border-radius:10px}
.route{margin-top:10px;font-size:14px}
.tips{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:14px}
.tips .key{color:var(--warn);font-weight:500}

.status{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 16px -12px rgb(0 0 0 / 35%)}
.status-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.count{font-weight:700;font-variant-numeric:tabular-nums}
.count small{font-weight:400;color:var(--muted);font-size:13px}
.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="shared"]::before{background:var(--ok)}
.sync[data-s="saving"]::before{background:var(--ember);animation:pulse 1s infinite}
.sync[data-s="readonly"]::before,.sync[data-s="error"]::before{background:var(--warn)}
.sync[data-s="readonly"],.sync[data-s="error"]{color:var(--warn)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.sync[data-s="saving"]::before{animation:none}}
.bar{height:8px;border-radius:99px;background:var(--forest-soft);overflow:hidden}
.bar span{display:block;height:100%;background:var(--forest);border-radius:99px;transition:width .3s}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.filters button{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.filters button b{font-weight:500;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.filters button[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--card)}
.filters button[aria-pressed="true"] b{color:inherit;opacity:.8}
.filters .unclaimed b{color:var(--ember)}

.group{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.group-title{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px 8px;font-weight:700}
.group-title small{font-weight:400;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.item{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px 12px;padding:10px 16px;border-top:1px solid var(--line)}
.item.has-x{grid-template-columns:1fr auto auto auto}
.tick{display:flex;align-items:flex-start;gap:10px;cursor:pointer;min-width:0}
.tick input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--forest);flex:none;cursor:pointer}
.name{overflow-wrap:anywhere}
.done .name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--forest)}
.qty{color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.owner{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 6px;font-size:14px;min-width:88px;cursor:pointer}
.owner.none{border-color:var(--ember);color:var(--ember);background:var(--ember-soft)}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:4px}
@media (max-width:480px){
  .item,.item.has-x{grid-template-columns:1fr auto}
  .item .qty{grid-column:1;grid-row:2;padding-left:30px;margin-top:-6px}
  .item .owner{grid-column:2;grid-row:1 / span 2}
  .item .x{grid-column:2;grid-row:3;justify-self:end}
}
.empty{padding:18px 16px;color:var(--muted);text-align:center}

.add{display:grid;grid-template-columns:auto 1fr 90px auto;gap:8px}
.add select,.add input{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 8px;min-width:0}
@media (max-width:560px){.add{grid-template-columns:1fr 90px}.add #add-group{grid-column:1 / -1}.add button{grid-column:1 / -1}}
.btn{border:1px solid var(--forest);background:var(--forest);color:var(--card);border-radius:10px;padding:8px 14px;font-weight:500;cursor:pointer}
.btn.ghost{background:transparent;color:var(--forest)}
.btn.danger{border-color:var(--ember);background:var(--ember);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.copybox{width:100%;min-height:180px;margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--ground);color:var(--ink);font:13px/1.5 var(--sans)}
.note{font-size:13px;color:var(--muted)}
.foot{font-size:12.5px;color:var(--muted);text-align:center;text-wrap:balance}
.readonly .item select,.readonly .item input{pointer-events:none;opacity:.7}
</style>
</head>
<body>
<style>
.tag{font-size:12.5px;font-weight:500;border-radius:999px;padding:2px 10px;white-space:nowrap;background:var(--forest-soft);color:var(--forest)}
.tag.p0{background:#E3ECF8;color:#2A5C9A}.tag.p1{background:#F4E4EF;color:#8E3A6E}.tag.p2{background:#FBEBD9;color:#9A5B14}.tag.p3{background:#E2F1EA;color:#1F6B4A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.p0{background:#1C2B40;color:#9CC1EE}:root:not([data-theme="light"]) .tag.p1{background:#3A2233;color:#E6A6CF}:root:not([data-theme="light"]) .tag.p2{background:#3A2C18;color:#EDBE85}:root:not([data-theme="light"]) .tag.p3{background:#193128;color:#8FD3B0}}
:root[data-theme="dark"] .tag.p0{background:#1C2B40;color:#9CC1EE}:root[data-theme="dark"] .tag.p1{background:#3A2233;color:#E6A6CF}:root[data-theme="dark"] .tag.p2{background:#3A2C18;color:#EDBE85}:root[data-theme="dark"] .tag.p3{background:#193128;color:#8FD3B0}
.item{grid-template-columns:1fr auto auto}
@media (max-width:480px){.item{grid-template-columns:1fr auto}.item .qty{grid-column:1;grid-row:2;padding-left:30px;margin-top:-6px}.item .tag{grid-column:2;grid-row:1 / span 2}}
.who-q{font-size:13px;color:var(--muted)}
.tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.group-note{font-weight:400;font-size:12.5px;color:var(--muted);margin-left:6px}
</style>

<div id="app"></div>

<script>
(function(){
  var PEOPLE=['小咭','Sophia','白雪','Candice'];
  var EVERY='每人自带';
  var GROUPS=[
    ['住与遮雨',[['a1','帐篷 / 天幕（确认营地是否提供）','1套','Sophia'],['a2','地布、防潮垫、营钉锤','1套','Sophia'],['a3','折叠桌 + 4把椅子','1套','Candice'],['a4','露营灯 / 头灯（含备用电池）','2–3盏','Candice'],['a5','雨衣 / 雨伞 / 天幕侧布','4份','Candice']]],
    ['吃喝与烹饪',[['b1','饮用水（按 3L/人）','12L','Sophia'],['b5','炉具 + 气罐（确认可用）','1套','Candice'],['b7','冰袋 / 保温箱','1个','Sophia'],['b2','面包（早餐 / 加餐）','4–8份','小咭'],['b3','咖啡（挂耳 / 冷萃 / 速溶）','4–8杯','小咭'],['b4','食材、水果','1批','小咭'],['b9','零食','1批',['小咭','白雪']],['b6','锅具、餐具、纸巾、保鲜袋','1套','白雪'],['b8','垃圾袋（干湿分开）','6个','白雪']]],
    ['安全与娱乐',[['d1','急救包、创可贴、消毒湿巾','1套','小咭'],['d2','常用药、过敏药','按需','小咭'],['d3','充电宝、充电线、插排','1套','小咭'],['d4','蓝牙音箱（注意音量）','1个','白雪'],['d5','飞盘 / 扑克 / 桌游','1–2样','白雪'],['d6','相机 / 三脚架','按需','小咭']]],
    ['衣物与个人',[['c1','速干衣、备用衣裤','1份',EVERY],['c2','防水鞋 / 拖鞋、备用袜','1份',EVERY],['c3','防晒霜、帽子、驱蚊液','1份',EVERY],['c4','身份证、现金、充电宝','1份',EVERY],['c5','洗漱用品、湿巾','1份',EVERY]]]
  ];
  var KEY='yiyue-camp-checks-v2', WHO='yiyue-camp-who';
  function get(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
  function set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  var checks=get(KEY,{}), who=get(WHO,''), copyText='';
  var app=document.getElementById('app');
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function owns(o,p){return Array.isArray(o)?o.indexOf(p)>=0:o===p}
  function mine(o){return !who||owns(o,who)||o===EVERY}
  function tag(o){if(Array.isArray(o))return '<span class="tags">'+o.map(tag).join('')+'</span>';var i=PEOPLE.indexOf(o);return '<span class="tag'+(i>=0?' p'+i:'')+'">'+esc(o)+'</span>'}

  function render(){
    var list=[];GROUPS.forEach(function(g){g[1].forEach(function(it){if(mine(it[3]))list.push(it)})});
    var done=list.filter(function(it){return checks[it[0]]}).length;
    var h='';
    h+='<header class="hero"><div><h1>一月一露 · 四人露营</h1>'+
      '<p class="sub">9月25日（周五）· 上海松江 · 各自带好，装车打勾，人齐出发</p>'+
      '<div class="chips"><span class="chip">☁ 25–32°C 阴</span><span class="chip">南风微风</span><span class="chip">备雨具 · 防晒 · 驱蚊</span></div></div>'+
      '<svg viewBox="0 0 190 108" aria-hidden="true"><path fill="#123c2e" d="M0 108V66l20-23 16 21 20-35 24 37 22-25 21 28 18-45 18 49 18-20 18 13v42z"/><circle cx="161" cy="23" r="12" fill="#f8dc91"/><path fill="#f3e8c6" d="M59 103l31-54 32 54z"/><path fill="#d58655" d="M90 49v54H59z"/><path stroke="#fff5d7" stroke-width="2" d="M90 49v54M59 103h63"/></svg></header>';

    h+='<section class="status" aria-label="我的装车进度"><div class="status-top">'+
      '<div class="count">'+(who?esc(who)+' 的装备 ':'全部装备 ')+done+' / '+list.length+' <small>已装车</small></div>'+
      '<div class="who-q">'+(who?'打勾只保存在你的手机上':'先点你的名字，只看自己要带的')+'</div></div>'+
      '<div class="bar"><span style="width:'+(list.length?100*done/list.length:0)+'%"></span></div>'+
      '<div class="filters" role="group" aria-label="我是谁">'+
      '<button type="button" data-who="" aria-pressed="'+(!who)+'">全部</button>'+
      PEOPLE.map(function(p){var n=0;GROUPS.forEach(function(g){g[1].forEach(function(it){if(owns(it[3],p))n++})});return '<button type="button" data-who="'+esc(p)+'" aria-pressed="'+(who===p)+'">'+esc(p)+'<b>'+n+'</b></button>'}).join('')+
      '</div></section>';

    GROUPS.forEach(function(g){
      var items=g[1].filter(function(it){return mine(it[3])}); if(!items.length) return;
      var every=items.every(function(it){return it[3]===EVERY});
      h+='<section class="group"><div class="group-title"><span>'+esc(g[0])+(every?'<span class="group-note">每个人都要带</span>':'')+'</span><small>'+items.filter(function(it){return checks[it[0]]}).length+' / '+items.length+'</small></div>';
      items.forEach(function(it){
        var c=!!checks[it[0]];
        h+='<div class="item'+(c?' done':'')+'"><label class="tick"><input type="checkbox" id="c-'+it[0]+'" data-id="'+it[0]+'"'+(c?' checked':'')+'><span class="name">'+esc(it[1])+'</span></label>'+
          '<span class="qty">'+esc(it[2])+'</span>'+tag(it[3])+'</div>';
      });
      h+='</section>';
    });

    h+='<section class="panel"><h2>发到群里</h2><div class="actions">'+
      '<button type="button" class="btn" data-act="copy">复制分工清单</button>'+
      '<button type="button" class="btn ghost" data-act="clear">清除我的勾选</button></div>'+
      (copyText?'<p class="note" style="margin-top:10px">无法自动复制，请长按全选下面的文字：</p><textarea class="copybox" id="copybox" readonly>'+esc(copyText)+'</textarea>':'')+'</section>';

    h+='<div class="two"><section class="panel"><h2>去哪儿</h2><div class="map"><svg viewBox="0 0 340 175" role="img" aria-label="从上海市区前往松江一月一露营地的示意地图"><rect width="340" height="175" fill="#d9ebcb"/><path d="M-5 38C65 17 101 76 164 44S250 43 345 8" fill="none" stroke="#91b7d1" stroke-width="12"/><path d="M14 157C74 137 107 122 160 126S249 108 337 132" fill="none" stroke="#f1cf83" stroke-width="8"/><path d="M30 13l42 149M109 2l28 168M217 0l-23 175M290 5l-17 165" stroke="#fff9e8" stroke-width="3" stroke-dasharray="9 7"/><path d="M55 34C99 55 123 79 179 99S253 125 296 137" fill="none" stroke="#e87853" stroke-width="5"/><circle cx="55" cy="34" r="9" fill="#2e7454"/><text x="20" y="23" fill="#174a35" font-size="12" font-weight="700">上海市区</text><path d="M296 112c-10 0-18 8-18 18 0 14 18 30 18 30s18-16 18-30c0-10-8-18-18-18z" fill="#c84f3f"/><circle cx="296" cy="130" r="5" fill="#fff"/><text x="236" y="104" fill="#743327" font-size="12" font-weight="700">一月一露</text></svg></div>'+
      '<p class="route">松江区西茹路 1 号（涌禾农场内）<br><a href="https://www.amap.com/place/B0I6X5DQ7C" target="_blank" rel="noopener">打开高德地图导航 ↗</a></p></section>'+
      '<section class="panel"><h2>出发前注意</h2><ul class="tips">'+
      '<li><span class="key">先确认营位、入场时间、能否明火 / 自带炉具。</span></li>'+
      '<li>雨后草地湿滑：带防水鞋或备用袜；帐篷避开低洼处。</li>'+
      '<li>每人带身份证、充电宝；车辆提前加油，离场前清点垃圾。</li>'+
      '<li>用火不离人；睡前熄火断电，垃圾分类带走。</li>'+
      '<li>这次温热潮湿，优先带雨衣、驱蚊液和速干衣。</li></ul></section></div>';
    h+='<p class="foot">天气参考中央气象台 9/24 发布的上海预报，出发前再看一次松江短临预报。营地规则以营地当天通知为准。</p>';
    app.innerHTML='<div class="wrap">'+h+'</div>';
    if(copyText){var cb=document.getElementById('copybox');if(cb){cb.focus();cb.select()}}
  }

  app.addEventListener('change',function(e){var id=e.target.getAttribute('data-id');if(!id)return;checks[id]=e.target.checked;set(KEY,checks);render()});
  app.addEventListener('click',function(e){
    var w=e.target.closest('[data-who]');
    if(w){who=w.getAttribute('data-who');set(WHO,who);render();return}
    var b=e.target.closest('[data-act]'); if(!b) return;
    if(b.getAttribute('data-act')==='clear'){GROUPS.forEach(function(g){g[1].forEach(function(it){if(mine(it[3]))delete checks[it[0]]})});set(KEY,checks);render()}
    if(b.getAttribute('data-act')==='copy'){
      var out='【一月一露 · 四人露营分工】9月25日（周五）\n地址：松江区西茹路1号（涌禾农场内）\n清单：'+location.href.split('#')[0]+'\n';
      PEOPLE.concat([EVERY]).forEach(function(p){var l=[];GROUPS.forEach(function(g){g[1].forEach(function(it){if(owns(it[3],p))l.push(it[1]+'（'+it[2]+'）'+(Array.isArray(it[3])?'，和'+it[3].filter(function(x){return x!==p}).join('、')+'一起':''))})});out+='\n'+p+'：\n- '+l.join('\n- ')+'\n'});
      var ok=function(){copyText='';b.textContent='已复制，发到群里吧';setTimeout(render,1600)};
      var fail=function(){copyText=out;render()};
      try{navigator.clipboard.writeText(out).then(ok,fail)}catch(err){fail()}
    }
  });
  render();
})();
</script>
</body>
</html>
